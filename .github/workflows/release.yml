name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build component
        run: msbuild foo_findplaylists.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Build tests
        run: msbuild tests/tests.vcxproj /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Run tests
        run: .\tests\x64\Release\tests.exe
      - name: Package component
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path x64\Release\foo_findplaylists.dll `
            -DestinationPath "foo_findplaylists-$ver.fb2k-component" -Force
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: foo_findplaylists-*.fb2k-component
