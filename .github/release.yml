# Configuration for GitHub's automated release notes generator
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: "🚀 Features & Enhancements"
      labels:
        - "feature"
        - "enhancement"
        - "feat"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "📚 Documentation"
      labels:
        - "documentation"
        - "docs"
    - title: "🧪 Tests & Build"
      labels:
        - "test"
        - "ci"
        - "build"
    - title: "🧰 Maintenance & Refactoring"
      labels:
        - "refactor"
        - "chore"
        - "perf"
